<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GHOST FINDER - Phasmophobia</title>
  
  <!-- スマホ（iPhone/Android）・PC共通の標準アイコン設定 -->
  <link rel="apple-touch-icon" href="./icon.png">
  <link rel="icon" type="image/png" href="./icon.png">

  <style>
    :root {
      --bg-color: #121214;
      --card-bg: #1A1A1E;
      --accent-color: #BB86FC;
      --accent-light: rgba(187, 134, 252, 0.15);
      --footstep-color: #64B5F6;
      --footstep-bg: rgba(100, 181, 246, 0.12);
      --volume-color: #4DB6AC;
      --volume-bg: rgba(77, 182, 172, 0.15);
      --check-color: #81C784;
      --check-bg: rgba(76, 175, 80, 0.12);
      --trait-color: #FFB74D;
      --trait-bg: rgba(255, 183, 77, 0.12);
      --highlight-bg: #2C2235;
      --text-main: #E1E1E6;
      --text-sub: #A1A1AA;
      --border-color: #2E2E35;
      --danger-color: #CF6679;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 16px;
      -webkit-tap-highlight-color: transparent;
    }

    .header {
      text-align: center;
      margin-bottom: 12px;
    }

    .header h1 {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--accent-color);
      margin: 0 0 4px 0;
    }

    .header p {
      font-size: 0.75rem;
      color: var(--text-sub);
      margin: 0;
    }

    .guide-tip {
      font-size: 0.72rem;
      color: var(--text-sub);
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 6px 10px;
      margin-bottom: 12px;
      text-align: center;
    }

    .search-container {
      margin-bottom: 10px;
    }

    .search-input {
      width: 100%;
      padding: 10px 12px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 0.82rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .search-input:focus {
      border-color: var(--accent-color);
    }

    .search-input::placeholder {
      color: var(--text-sub);
    }

    .controls-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      margin-bottom: 6px;
    }

    .section-title {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-sub);
      letter-spacing: 0.05em;
    }

    .btn-reset {
      background-color: transparent;
      border: 1px solid var(--danger-color);
      color: var(--danger-color);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
    }

    .button-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      margin-bottom: 10px;
    }

    .button-grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 10px;
    }

    .button-grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      margin-bottom: 10px;
    }

    .btn-filter {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 9px 4px;
      font-size: 0.78rem;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
      font-weight: 500;
      user-select: none;
    }

    .btn-filter.active-evidence {
      background-color: var(--accent-color);
      color: #000000;
      border-color: var(--accent-color);
      font-weight: 700;
    }

    .btn-filter.active-hunt {
      background-color: var(--danger-color);
      color: #000000;
      border-color: var(--danger-color);
      font-weight: 700;
    }

    .btn-filter.active-speed {
      background-color: var(--footstep-color);
      color: #000000;
      border-color: var(--footstep-color);
      font-weight: 700;
    }

    .btn-filter.active-volume {
      background-color: var(--volume-color);
      color: #000000;
      border-color: var(--volume-color);
      font-weight: 700;
    }

    .btn-filter.active-trait {
      background-color: var(--trait-color);
      color: #000000;
      border-color: var(--trait-color);
      font-weight: 700;
    }

    .btn-filter.eliminated {
      text-decoration: line-through;
      opacity: 0.45;
      background-color: rgba(255, 255, 255, 0.05);
      color: var(--text-sub);
      border-color: var(--border-color);
    }

    .results-count {
      font-size: 0.85rem;
      color: var(--text-sub);
      margin: 16px 0 10px 0;
      font-weight: 600;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid var(--border-color);
      transition: opacity 0.2s ease;
    }

    .card.card-eliminated {
      opacity: 0.35;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 6px;
    }

    .ghost-name {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-main);
      cursor: pointer;
      user-select: none;
    }

    .ghost-name.eliminated {
      text-decoration: line-through;
      color: var(--text-sub);
    }

    .badges {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .badge {
      font-size: 0.68rem;
      background-color: var(--accent-light);
      color: var(--accent-color);
      padding: 3px 7px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
    }

    .badge.badge-hunt {
      background-color: rgba(207, 102, 121, 0.15);
      color: var(--danger-color);
    }

    .badge.badge-speed {
      background-color: var(--footstep-bg);
      color: var(--footstep-color);
    }

    .badge.badge-volume {
      background-color: var(--volume-bg);
      color: var(--volume-color);
    }

    .badge.eliminated {
      text-decoration: line-through;
      opacity: 0.45;
      background-color: rgba(255, 255, 255, 0.08) !important;
      color: var(--text-sub) !important;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
    }

    .tag {
      font-size: 0.75rem;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      cursor: pointer;
      user-select: none;
    }

    .tag.matched {
      border-color: var(--accent-color);
      color: var(--accent-color);
    }

    .tag.eliminated {
      text-decoration: line-through;
      opacity: 0.45;
      background-color: var(--border-color);
      color: var(--text-sub);
    }

    .trait-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 8px;
    }

    .trait-badge {
      font-size: 0.68rem;
      background-color: var(--trait-bg);
      color: var(--trait-color);
      border: 1px solid rgba(255, 183, 77, 0.3);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
    }

    .trait-badge.eliminated {
      text-decoration: line-through;
      opacity: 0.45;
      background-color: rgba(255, 255, 255, 0.08) !important;
      color: var(--text-sub) !important;
      border-color: var(--border-color) !important;
    }

    .unique-box {
      background-color: var(--highlight-bg);
      border-left: 3px solid var(--accent-color);
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--accent-color);
      margin-bottom: 6px;
    }

    .footstep-box {
      background-color: var(--footstep-bg);
      border-left: 3px solid var(--footstep-color);
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--footstep-color);
      margin-bottom: 6px;
    }

    .check-box {
      background-color: var(--check-bg);
      border-left: 3px solid var(--check-color);
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--check-color);
      margin-bottom: 8px;
    }

    .ghost-note {
      font-size: 0.78rem;
      color: var(--text-sub);
      line-height: 1.45;
    }

    .no-results {
      text-align: center;
      color: var(--text-sub);
      font-size: 0.85rem;
      margin-top: 30px;
    }
  </style>
</head>

    let selectedEvidences = [], eliminatedEvidences = [];
    let selectedHunts = [], eliminatedHunts = [];
    let selectedSpeeds = [], eliminatedSpeeds = [];
    let selectedVolumes = [], eliminatedVolumes = [];
    let selectedTraits = [], eliminatedTraits = [];
    let eliminatedGhosts = [];
    let searchQuery = '';

    window.onload = function() {
      initApp();
    };

    function initApp() {
      renderAllButtons();
      renderCards();
    }

    function cycleFilter(category, value, event) {
      if (event) event.stopPropagation();

      let selArr, elimArr;
      if (category === 'evidence') { selArr = selectedEvidences; elimArr = eliminatedEvidences; }
      else if (category === 'hunt') { selArr = selectedHunts; elimArr = eliminatedHunts; }
      else if (category === 'speed') { selArr = selectedSpeeds; elimArr = eliminatedSpeeds; }
      else if (category === 'volume') { selArr = selectedVolumes; elimArr = eliminatedVolumes; }
      else if (category === 'trait') { selArr = selectedTraits; elimArr = eliminatedTraits; }

      const selIdx = selArr.indexOf(value);
      const elimIdx = elimArr.indexOf(value);

      if (selIdx === -1 && elimIdx === -1) {
        selArr.push(value);
      } else if (selIdx !== -1) {
        selArr.splice(selIdx, 1);
        elimArr.push(value);
      } else {
        elimArr.splice(elimIdx, 1);
      }

      renderAllButtons();
      renderCards();
    }

    function toggleEliminateGhost(ghostName, event) {
      if (event) event.stopPropagation();
      const idx = eliminatedGhosts.indexOf(ghostName);
      if (idx !== -1) {
        eliminatedGhosts.splice(idx, 1);
      } else {
        eliminatedGhosts.push(ghostName);
      }
      renderCards();
    }

    function renderAllButtons() {
      const evidencesSet = new Set();
      ghostData.forEach(g => g.evidences.forEach(e => evidencesSet.add(e)));
      const evContainer = document.getElementById('evidence-buttons');
      evContainer.innerHTML = '';
      Array.from(evidencesSet).sort().forEach(ev => {
        const btn = document.createElement('button');
        let cls = 'btn-filter';
        if (selectedEvidences.includes(ev)) cls += ' active-evidence';
        if (eliminatedEvidences.includes(ev)) cls += ' eliminated';
        btn.className = cls;
        btn.innerText = ev;
        btn.onclick = function(e) { cycleFilter('evidence', ev, e); };
        evContainer.appendChild(btn);
      });

      const huntCategories = ["50% (標準)", "60%以上 (高)", "40%以下 (低)", "条件変動・特殊"];
      const huContainer = document.getElementById('hunt-buttons');
      huContainer.innerHTML = '';
      huntCategories.forEach(hu => {
        const btn = document.createElement('button');
        let cls = 'btn-filter';
        if (selectedHunts.includes(hu)) cls += ' active-hunt';
        if (eliminatedHunts.includes(hu)) cls += ' eliminated';
        btn.className = cls;
        btn.innerText = hu;
        btn.onclick = function(e) { cycleFilter('hunt', hu, e); };
        huContainer.appendChild(btn);
      });

      const speedsSet = new Set();
      ghostData.forEach(g => { if (g.speed) speedsSet.add(g.speed); });
      const spContainer = document.getElementById('speed-buttons');
      spContainer.innerHTML = '';
      Array.from(speedsSet).sort().forEach(sp => {
        const btn = document.createElement('button');
        let cls = 'btn-filter';
        if (selectedSpeeds.includes(sp)) cls += ' active-speed';
        if (eliminatedSpeeds.includes(sp)) cls += ' eliminated';
        btn.className = cls;
        btn.innerText = sp;
        btn.onclick = function(e) { cycleFilter('speed', sp, e); };
        spContainer.appendChild(btn);
      });

      const volumesSet = new Set();
      ghostData.forEach(g => { if (g.volume) volumesSet.add(g.volume); });
      const volContainer = document.getElementById('volume-buttons');
      volContainer.innerHTML = '';
      Array.from(volumesSet).sort().forEach(vol => {
        const btn = document.createElement('button');
        let cls = 'btn-filter';
        if (selectedVolumes.includes(vol)) cls += ' active-volume';
        if (eliminatedVolumes.includes(vol)) cls += ' eliminated';
        btn.className = cls;
        btn.innerText = vol;
        btn.onclick = function(e) { cycleFilter('volume', vol, e); };
        volContainer.appendChild(btn);
      });

      const traitCounts = {};
      ghostData.forEach(g => {
        if (g.traits) g.traits.forEach(t => { traitCounts[t] = (traitCounts[t] || 0) + 1; });
      });
      const trContainer = document.getElementById('trait-buttons');
      trContainer.innerHTML = '';
      Object.keys(traitCounts)
        .filter(t => traitCounts[t] >= 2)
        .sort()
        .forEach(tr => {
          const btn = document.createElement('button');
          let cls = 'btn-filter';
          if (selectedTraits.includes(tr)) cls += ' active-trait';
          if (eliminatedTraits.includes(tr)) cls += ' eliminated';
          btn.className = cls;
          btn.innerText = tr;
          btn.onclick = function(e) { cycleFilter('trait', tr, e); };
          trContainer.appendChild(btn);
        });
    }

    function handleSearch(val) {
      searchQuery = val.trim().toLowerCase();
      renderCards();
    }

    function resetFilters() {
      selectedEvidences = []; eliminatedEvidences = [];
      selectedHunts = []; eliminatedHunts = [];
      selectedSpeeds = []; eliminatedSpeeds = [];
      selectedVolumes = []; eliminatedVolumes = [];
      selectedTraits = []; eliminatedTraits = [];
      eliminatedGhosts = [];
      searchQuery = '';
      document.getElementById('search-input').value = '';
      renderAllButtons();
      renderCards();
    }

    function renderCards() {
      const container = document.getElementById('cards-container');
      const countEl = document.getElementById('results-count');

      const filtered = ghostData.filter(ghost => {
        const matchEvidence = selectedEvidences.every(se => ghost.evidences.includes(se));
        const matchHunt = selectedHunts.length === 0 || selectedHunts.includes(ghost.huntCategory);
        const matchSpeed = selectedSpeeds.length === 0 || selectedSpeeds.includes(ghost.speed);
        const matchVolume = selectedVolumes.length === 0 || selectedVolumes.includes(ghost.volume);
        const matchTrait = selectedTraits.every(st => ghost.traits && ghost.traits.includes(st));

        const matchSearch = !searchQuery || [
          ghost.name,
          ...ghost.evidences,
          ghost.unique || '',
          ghost.footstep || '',
          ghost.check || '',
          ghost.note || '',
          ...(ghost.traits || [])
        ].some(text => text.toLowerCase().includes(searchQuery));

        return matchEvidence && matchHunt && matchSpeed && matchVolume && matchTrait && matchSearch;
      });

      countEl.innerText = `該当： ${filtered.length} 件`;
      container.innerHTML = '';

      if (filtered.length === 0) {
        container.innerHTML = '<div class="no-results">条件に一致するゴーストがいません</div>';
        return;
      }

      filtered.forEach(ghost => {
        const isNameEliminated = eliminatedGhosts.includes(ghost.name);
        const isCardEliminated = isNameEliminated;

        const card = document.createElement('div');
        card.className = 'card' + (isCardEliminated ? ' card-eliminated' : '');

        const tagsHtml = ghost.evidences.map(e => {
          const isMatched = selectedEvidences.includes(e);
          const isElim = eliminatedEvidences.includes(e);
          let cls = 'tag';
          if (isMatched) cls += ' matched';
          if (isElim) cls += ' eliminated';
          return `<span class="${cls}" onclick="cycleFilter('evidence', '${e}', event)" title="タップで選択/打ち消し切替">${e}</span>`;
        }).join('');

        const huntElim = eliminatedHunts.includes(ghost.huntCategory);
        const speedElim = eliminatedSpeeds.includes(ghost.speed);
        const volElim = eliminatedVolumes.includes(ghost.volume);

        const huntBadgeHtml = ghost.hunt ? `<span class="badge badge-hunt ${huntElim ? 'eliminated' : ''}" onclick="cycleFilter('hunt', '${ghost.huntCategory}', event)">⚡ ${ghost.hunt}</span>` : '';
        const speedBadgeHtml = ghost.speed ? `<span class="badge badge-speed ${speedElim ? 'eliminated' : ''}" onclick="cycleFilter('speed', '${ghost.speed}', event)">👟 ${ghost.speed}</span>` : '';
        const volBadgeHtml = ghost.volume ? `<span class="badge badge-volume ${volElim ? 'eliminated' : ''}" onclick="cycleFilter('volume', '${ghost.volume}', event)">🔊 ${ghost.volume}</span>` : '';

        const traitBadgesHtml = (ghost.traits || []).map(t => {
          const tElim = eliminatedTraits.includes(t);
          return `<span class="trait-badge ${tElim ? 'eliminated' : ''}" onclick="cycleFilter('trait', '${t}', event)">🏷️ ${t}</span>`;
        }).join('');

        const ghostNameHtml = `<span class="ghost-name ${isNameEliminated ? 'eliminated' : ''}" onclick="toggleEliminateGhost('${ghost.name}', event)" title="タップでゴースト名の打ち消し切替">👻 ${ghost.name}</span>`;

        card.innerHTML = `
          <div class="card-header">
            ${ghostNameHtml}
            <div class="badges">
              ${huntBadgeHtml}
              ${speedBadgeHtml}
              ${volBadgeHtml}
            </div>
          </div>
          <div class="tags">${tagsHtml}</div>
          ${traitBadgesHtml ? `<div class="trait-badges">${traitBadgesHtml}</div>` : ''}
          ${ghost.unique ? `<div class="unique-box">⭐ 確定特徴: ${ghost.unique}</div>` : ''}
          ${ghost.footstep ? `<div class="footstep-box">👟 足音の特徴: ${ghost.footstep}</div>` : ''}
          ${ghost.check ? `<div class="check-box">💡 迷った時の判別法: ${ghost.check}</div>` : ''}
          <div class="ghost-note">${ghost.note || ''}</div>
        `;
        container.appendChild(card);
      });
    }
  </script>
</body>
</html>
