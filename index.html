      --card-bg: #1A1A1E;
      --accent-color: #BB86FC;
      --accent-light: rgba(187, 134, 252, 0.15);
      --footstep-color: #64B5F6;
      --footstep-bg: rgba(100, 181, 246, 0.12);
      --volume-color: #4DB6AC;
      --volume-bg: rgba(77, 182, 172, 0.15);
      --check-color: #81C784;
      --check-bg: rgba(76, 175, 80, 0.12);
      --trait-color: #FFB74D;
      --trait-bg: rgba(255, 183, 77, 0.12);
      --highlight-bg: #2C2235;
      --text-main: #E1E1E6;
      --text-sub: #A1A1AA;
      --border-color: #2E2E35;
      --danger-color: #CF6679;
    }

    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 12px;
      -webkit-tap-highlight-color: transparent;
    }

    .header {
      text-align: center;
      margin-bottom: 8px;
    }

    .header h1 {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--accent-color);
      margin: 0;
    }

    .tools-panel {
      background-color: var(--card-bg);
      border: 1px solid var(--accent-color);
      border-radius: 8px;
      margin-bottom: 12px;
      overflow: hidden;
    }

    .tools-header {
      padding: 10px 12px;
      background-color: rgba(187, 134, 252, 0.1);
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--accent-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .tools-content {
      padding: 12px;
      display: none;
      border-top: 1px solid var(--border-color);
    }

    .tools-content.open {
      display: block;
    }

    .tool-block {
      margin-bottom: 12px;
    }
    .tool-block:last-child { margin-bottom: 0; }

    .tool-title {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-sub);
      margin-bottom: 6px;
    }

    .flex-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn-tool {
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      flex: 1;
      text-align: center;
    }
    .btn-tool:active { background-color: var(--border-color); }

    .timer-display {
      font-family: monospace;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent-color);
      min-width: 60px;
      text-align: center;
    }

    .timer-status {
      font-size: 0.7rem;
      color: var(--text-sub);
      margin-top: 4px;
    }
    .timer-status span.active {
      color: var(--check-color);
      font-weight: 700;
    }

    .bpm-result {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--footstep-color);
    }

    /* --- メインUI --- */
    .search-input {
      width: 100%;
      padding: 8px 12px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 0.8rem;
      outline: none;
      margin-bottom: 10px;
      -webkit-user-select: text;
      user-select: text;
    }

    .controls-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      margin-bottom: 6px;
    }

    .section-title {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-sub);
    }

    .btn-reset {
      background-color: transparent;
      border: 1px solid var(--danger-color);
      color: var(--danger-color);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.7rem;
      font-weight: 600;
    }

    .button-grid, .button-grid-2, .button-grid-3, .button-grid-4 {
      display: grid;
      gap: 6px;
      margin-bottom: 8px;
    }
    .button-grid { grid-template-columns: repeat(2, 1fr); }
    .button-grid-2 { grid-template-columns: repeat(2, 1fr); }
    .button-grid-3 { grid-template-columns: repeat(3, 1fr); }
    .button-grid-4 { grid-template-columns: repeat(4, 1fr); }

      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 8px 2px;
      font-size: 0.75rem;
      color: var(--text-main);
      text-align: center;
      font-weight: 500;
      transition: transform 0.15s ease, opacity 0.15s ease, background-color 0.15s ease;
      position: relative;

      transform: scale(0.92);
      opacity: 0.7;
      border-color: var(--accent-color);
    }

      color: var(--text-sub);

      padding: 12px;

    let currentEvidenceMode = 3;
    let selectedEvidences = [], eliminatedEvidences = [];
    let selectedHunts = [], eliminatedHunts = [];
    let selectedSpeeds = [], eliminatedSpeeds = [];
    let selectedVolumes = [], eliminatedVolumes = [];
    let selectedTraits = [], eliminatedTraits = [];
    let eliminatedGhosts = [];
    let searchQuery = '';

    function toggleTools() {
      const content = document.getElementById('tools-content');
      const arrow = document.getElementById('tools-arrow');
      if (content.classList.contains('open')) {
        content.classList.remove('open');
        arrow.innerText = '▼';
      } else {
        content.classList.add('open');
        arrow.innerText = '▲';
      }
    }

    let smudgeTimerInterval = null;
    let smudgeSeconds = 0;
    function handleSmudgeTimer() {
      if (smudgeTimerInterval) {
        clearInterval(smudgeTimerInterval);
        smudgeTimerInterval = null;
        smudgeSeconds = 0;
        document.getElementById('smudge-display').innerText = '000s';
        updateSmudgeStatus(0);
        return;
      }

      smudgeSeconds = 0;
      document.getElementById('smudge-display').innerText = '000s';
      smudgeTimerInterval = setInterval(() => {
        smudgeSeconds++;
        document.getElementById('smudge-display').innerText = String(smudgeSeconds).padStart(3, '0') + 's';
        updateSmudgeStatus(smudgeSeconds);
      }, 1000);
    }

    function updateSmudgeStatus(sec) {
      document.getElementById('st-demon').className = (sec > 0 && sec <= 60) ? 'active' : '';
      document.getElementById('st-normal').className = (sec > 60 && sec <= 90) ? 'active' : '';
      document.getElementById('st-spirit').className = (sec >= 180) ? 'active' : '';
    }

    let tapTimes = [];
    function handleFootstepTap() {
      const now = Date.now();
      tapTimes.push(now);
      tapTimes = tapTimes.filter(t => now - t < 2500);

      if (tapTimes.length >= 3) {
        let intervals = [];
        for (let i = 1; i < tapTimes.length; i++) {
          intervals.push(tapTimes[i] - tapTimes[i - 1]);
        }
        const avgInterval = intervals.reduce((a, b) => a + b, 0) / intervals.length;
        const bpm = 60000 / avgInterval;
        const speed = ((bpm / 110) * 1.7).toFixed(2);
        document.getElementById('bpm-display').innerText = `約 ${speed} m/s`;
      } else {
        document.getElementById('bpm-display').innerText = 'タップ中...';
      }
    }

    function attachLongPress(element, callback) {
      let timer = null;
      let startX = 0, startY = 0;

      const start = (e) => {
        const touch = e.touches ? e.touches[0] : e;
        startX = touch.clientX;
        startY = touch.clientY;
        element.classList.add('pressing');

        timer = setTimeout(() => {
          if (navigator.vibrate) navigator.vibrate(25);
          element.classList.remove('pressing');
          callback();
          timer = null;
        }, 200);
      };

      const move = (e) => {
        if (!timer) return;
        const touch = e.touches ? e.touches[0] : e;
        if (Math.abs(touch.clientX - startX) > 10 || Math.abs(touch.clientY - startY) > 10) {
          clearTimeout(timer);
          timer = null;
          element.classList.remove('pressing');
        }
      };

      const end = () => {
        element.classList.remove('pressing');
        if (timer) {
          clearTimeout(timer);
          timer = null;
        }
      };

      element.addEventListener('touchstart', start, { passive: true });
      element.addEventListener('touchmove', move, { passive: true });
      element.addEventListener('touchend', end, { passive: true });
      element.addEventListener('mousedown', start);
      element.addEventListener('mousemove', move);
      element.addEventListener('mouseup', end);
      element.addEventListener('mouseleave', end);
      element.addEventListener('contextmenu', (e) => e.preventDefault());
    }

    window.onload = function() {
      initApp();
    };

    function initApp() {
      document.getElementById('reset-btn').addEventListener('click', resetFilters);
      renderAllButtons();
      renderCards();
    }

    function cycleFilter(category, value) {
      let selArr, elimArr;
      if (category === 'evidence') { selArr = selectedEvidences; elimArr = eliminatedEvidences; }
      else if (category === 'hunt') { selArr = selectedHunts; elimArr = eliminatedHunts; }
      else if (category === 'speed') { selArr = selectedSpeeds; elimArr = eliminatedSpeeds; }
      else if (category === 'volume') { selArr = selectedVolumes; elimArr = eliminatedVolumes; }
      else if (category === 'trait') { selArr = selectedTraits; elimArr = eliminatedTraits; }

      const selIdx = selArr.indexOf(value);
      const elimIdx = elimArr.indexOf(value);

      if (selIdx === -1 && elimIdx === -1) {
        selArr.push(value);
      } else if (selIdx !== -1) {
        selArr.splice(selIdx, 1);
        elimArr.push(value);
      } else {
        elimArr.splice(elimIdx, 1);
      }

      renderAllButtons();
      renderCards();
    }

    function toggleEliminateGhost(ghostName) {
      const idx = eliminatedGhosts.indexOf(ghostName);
      if (idx !== -1) eliminatedGhosts.splice(idx, 1);
      else eliminatedGhosts.push(ghostName);
      renderCards();
    }

    function renderAllButtons() {
      const modeContainer = document.getElementById('mode-buttons');
      modeContainer.innerHTML = '';
      const modes = [
        { label: "3個", val: 3 },
        { label: "2個", val: 2 },
        { label: "1個", val: 1 },
        { label: "0個", val: 0 }
      ];
      modes.forEach(m => {
        const btn = document.createElement('button');
        btn.className = 'btn-filter' + (currentEvidenceMode === m.val ? ' active-mode' : '');
        btn.innerText = m.label;
        attachLongPress(btn, () => {
          currentEvidenceMode = m.val;
          renderAllButtons();
          renderCards();
        });
        modeContainer.appendChild(btn);
      });

      const evidencesSet = new Set();
      ghostData.forEach(g => g.evidences.forEach(e => evidencesSet.add(e)));
      const evContainer = document.getElementById('evidence-buttons');
      evContainer.innerHTML = '';
      Array.from(evidencesSet).sort().forEach(ev => {
        const btn = document.createElement('button');
        let cls = 'btn-filter';
        if (selectedEvidences.includes(ev)) cls += ' active-evidence';
        if (eliminatedEvidences.includes(ev)) cls += ' eliminated';
        btn.className = cls;
        btn.innerText = ev;
        attachLongPress(btn, () => cycleFilter('evidence', ev));
        evContainer.appendChild(btn);
      });

      const huntCategories = ["50% (標準)", "60%以上 (高)", "40%以下 (低)", "条件変動・特殊"];
      const huContainer = document.getElementById('hunt-buttons');
      huContainer.innerHTML = '';
      huntCategories.forEach(hu => {
        const btn = document.createElement('button');
        let cls = 'btn-filter';
        if (selectedHunts.includes(hu)) cls += ' active-hunt';
        if (eliminatedHunts.includes(hu)) cls += ' eliminated';
        btn.className = cls;
        btn.innerText = hu;
        attachLongPress(btn, () => cycleFilter('hunt', hu));
        huContainer.appendChild(btn);
      });

      const speedsSet = new Set();
      ghostData.forEach(g => { if (g.speed) speedsSet.add(g.speed); });
      const spContainer = document.getElementById('speed-buttons');
      spContainer.innerHTML = '';
      Array.from(speedsSet).sort().forEach(sp => {
        const btn = document.createElement('button');
        let cls = 'btn-filter';
        if (selectedSpeeds.includes(sp)) cls += ' active-speed';
        if (eliminatedSpeeds.includes(sp)) cls += ' eliminated';
        btn.className = cls;
        btn.innerText = sp;
        attachLongPress(btn, () => cycleFilter('speed', sp));
        spContainer.appendChild(btn);
      });

      const volumesSet = new Set();
      ghostData.forEach(g => { if (g.volume) volumesSet.add(g.volume); });
      const volContainer = document.getElementById('volume-buttons');
      volContainer.innerHTML = '';
      Array.from(volumesSet).sort().forEach(vol => {
        const btn = document.createElement('button');
        let cls = 'btn-filter';
        if (selectedVolumes.includes(vol)) cls += ' active-volume';
        if (eliminatedVolumes.includes(vol)) cls += ' eliminated';
        btn.className = cls;
        btn.innerText = vol;
        attachLongPress(btn, () => cycleFilter('volume', vol));
        volContainer.appendChild(btn);
      });

      const traitCounts = {};
      ghostData.forEach(g => {
        if (g.traits) g.traits.forEach(t => { traitCounts[t] = (traitCounts[t] || 0) + 1; });
      });
      const trContainer = document.getElementById('trait-buttons');
      trContainer.innerHTML = '';
      Object.keys(traitCounts).filter(t => traitCounts[t] >= 2).sort().forEach(tr => {
        const btn = document.createElement('button');
        let cls = 'btn-filter';
        if (selectedTraits.includes(tr)) cls += ' active-trait';
        if (eliminatedTraits.includes(tr)) cls += ' eliminated';
        btn.className = cls;
        btn.innerText = tr;
        attachLongPress(btn, () => cycleFilter('trait', tr));
        trContainer.appendChild(btn);
      });
    }

    function handleSearch(val) {
      searchQuery = val.trim().toLowerCase();
      renderCards();
    }

    function resetFilters() {
      currentEvidenceMode = 3;
      selectedEvidences = []; eliminatedEvidences = [];
      selectedHunts = []; eliminatedHunts = [];
      selectedSpeeds = []; eliminatedSpeeds = [];
      selectedVolumes = []; eliminatedVolumes = [];
      selectedTraits = []; eliminatedTraits = [];
      eliminatedGhosts = [];
      searchQuery = '';
      document.getElementById('search-input').value = '';
      renderAllButtons();
      renderCards();
    }

    function renderCards() {
      const container = document.getElementById('cards-container');
      const countEl = document.getElementById('results-count');

      const filtered = ghostData.filter(ghost => {
        const matchEvidence = (() => {
          if (currentEvidenceMode === 0) return true;
          const ghostValidEvidences = ghost.name === "ミミック" ? [...ghost.evidences, "ゴーストオーブ"] : ghost.evidences;
          if (!selectedEvidences.every(se => ghostValidEvidences.includes(se))) return false;
          if (ghost.forced && eliminatedEvidences.includes(ghost.forced)) return false;
          
          const matchedEliminatedCount = ghost.evidences.filter(e => eliminatedEvidences.includes(e)).length;
          if (matchedEliminatedCount > (3 - currentEvidenceMode)) return false;
          return true;
        })();

        const matchHunt = selectedHunts.length === 0 || selectedHunts.includes(ghost.huntCategory);
        const matchSpeed = selectedSpeeds.length === 0 || selectedSpeeds.includes(ghost.speed);
        const matchVolume = selectedVolumes.length === 0 || selectedVolumes.includes(ghost.volume);
        const matchTrait = selectedTraits.every(st => ghost.traits && ghost.traits.includes(st));

        const matchSearch = !searchQuery || [
          ghost.name, ...ghost.evidences, ghost.unique || '', ghost.footstep || '', ghost.check || '', ghost.note || '', ...(ghost.traits || [])
        ].some(text => text.toLowerCase().includes(searchQuery));

        return matchEvidence && matchHunt && matchSpeed && matchVolume && matchTrait && matchSearch;
      });

      countEl.innerText = `該当： ${filtered.length} 件`;
      container.innerHTML = '';

      if (filtered.length === 0) {
        container.innerHTML = '<div style="text-align:center; color:var(--text-sub); font-size:0.8rem; margin-top:20px;">一致するゴーストがいません</div>';
        return;
      }

      filtered.forEach(ghost => {
        const isNameEliminated = eliminatedGhosts.includes(ghost.name);
        const card = document.createElement('div');
        card.className = 'card' + (isNameEliminated ? ' card-eliminated' : '');

        const cardHeader = document.createElement('div');
        cardHeader.className = 'card-header';

        const ghostNameEl = document.createElement('div');
        ghostNameEl.className = `ghost-name ${isNameEliminated ? 'eliminated' : ''}`;
        ghostNameEl.innerText = `👻 ${ghost.name}`;
        attachLongPress(ghostNameEl, () => toggleEliminateGhost(ghost.name));

        const badgesEl = document.createElement('div');
        badgesEl.className = 'badges';
        badgesEl.innerHTML = `<span class="badge badge-hunt">ハント:${ghost.hunt}</span><span class="badge badge-speed">速度:${ghost.speed}</span>`;

        cardHeader.appendChild(ghostNameEl);
        cardHeader.appendChild(badgesEl);

        const tagsContainer = document.createElement('div');
        tagsContainer.className = 'tags';
        ghost.evidences.forEach(e => {
          const tagSpan = document.createElement('span');
          let cls = 'tag';
          if (selectedEvidences.includes(e)) cls += ' matched';
          if (eliminatedEvidences.includes(e)) cls += ' eliminated';
          tagSpan.className = cls;
          tagSpan.innerText = e;
          attachLongPress(tagSpan, () => cycleFilter('evidence', e));
          tagsContainer.appendChild(tagSpan);
        });

        card.appendChild(cardHeader);
        card.appendChild(tagsContainer);

        let detailHtml = '';
        if (ghost.unique) detailHtml += `<div class="unique-box">⭐ 特徴: ${ghost.unique}</div>`;
        if (ghost.footstep) detailHtml += `<div class="footstep-box">👟 足音: ${ghost.footstep}</div>`;
        if (ghost.check) detailHtml += `<div class="check-box">🔍 判別法: ${ghost.check}</div>`;
        if (ghost.note) detailHtml += `<div class="ghost-note">📝 ${ghost.note}</div>`;

        const detailsDiv = document.createElement('div');
        detailsDiv.innerHTML = detailHtml;
        card.appendChild(detailsDiv);

        container.appendChild(card);
      });
    }
